[project]
name = "satbench"
version = "0.1.0"
description = "STAT3007 G3: pretraining strategies for cross-domain satellite image classification"
readme = "README.md"
requires-python = ">=3.10"
# Lower bounds only, so Colab can reuse its preinstalled CUDA torch.
# Exact local versions are pinned in uv.lock.
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "torchgeo>=0.6.2",
]

[project.scripts]
satbench = "satbench.cli:main"

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",  # nicer progress bars in notebooks
    "nbstripout>=0.7",
    "pytest>=8.0",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Windows + NVIDIA GPU only: PyPI ships CPU-only torch wheels for Windows.
# Uncomment the block below, then run `uv lock && uv sync`.
# (Linux PyPI wheels already include CUDA; macOS wheels include MPS.)
# ---------------------------------------------------------------------------
# [tool.uv.sources]
# torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
# torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
#
# [[tool.uv.index]]
# name = "pytorch-cu126"
# url = "https://download.pytorch.org/whl/cu126"
# explicit = true
